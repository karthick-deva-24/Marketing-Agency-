<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stackly Marketing Agency</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#000000',
            foreground: '#ffffff',
            primary: '#a855f7',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
    
    .glass-form { 
      background: rgba(15, 23, 42, 0.4); 
      backdrop-filter: blur(25px); 
      border: 1px solid rgba(255,255,255,0.08); 
    }
    
    .deep-purple-glow {
      position: absolute;
      width: 150vw;
      height: 70vh;
      left: 50%;
      transform: translateX(-50%);
      top: -10vh;
      background: radial-gradient(ellipse at center, rgba(124, 58, 237, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* Ambient background orbs */
    .bg-shape {
      position: absolute;
      filter: blur(120px);
      border-radius: 50%;
      z-index: -2;
      animation: pulse 10s infinite alternate ease-in-out;
    }
    
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      100% { transform: scale(1.2) translate(30px, -50px); opacity: 0.6; }
    }
  </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative selection:bg-purple-500/30">


  <!-- Animated Background Orbs (Synced to Purple Theme) -->
  <div class="deep-purple-glow"></div>
  <div class="bg-shape bg-purple-600/40 w-[60vw] h-[60vw] md:w-[40vw] md:h-[40vw] top-[-10%] left-[-10%]"></div>
  <div class="bg-shape bg-fuchsia-500/30 w-[50vw] h-[50vw] md:w-[35vw] md:h-[35vw] bottom-[-10%] right-[-10%]" style="animation-delay: -5s"></div>

  <main class="w-full max-w-md p-8 relative z-10 mx-6">
    <div class="text-center mb-10">
      <div class="flex justify-center mb-6">
        <a href="index.html" class="inline-block">
          <img src="logo_0198.webp" alt="Stackly Brand Logo" class="h-10 w-auto object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] hover:scale-105 transition-transform duration-300">
        </a>
      </div>
      <span class="inline-block border border-purple-500/30 rounded-full px-4 py-1.5 text-xs tracking-widest font-bold text-purple-400 mb-6 bg-purple-500/10 backdrop-blur-sm uppercase">Secure Gateway</span>
      <h1 class="text-4xl font-medium tracking-tight text-white mb-3">Welcome Back</h1>
      <p class="text-gray-400 font-light text-sm">Log in to manage your campaigns, access analytics, and drive growth.</p>
    </div>

    <div class="glass-form p-8 rounded-3xl shadow-[0_0_50px_rgba(168,85,247,0.15)]">
      <form class="space-y-6" onsubmit="event.preventDefault(); if(this.checkValidity()) { const email = document.getElementById('email').value; const role = document.querySelector('input[name=\'role\']:checked').value; localStorage.setItem('userEmail', email); localStorage.setItem('userRole', role); window.location.href = role === 'admin' ? 'admin-dashboard.html' : 'user-dashboard.html'; }">
        
        <!-- Role Selection -->
        <div class="space-y-2">
          <label class="text-xs uppercase tracking-widest font-semibold text-gray-400">Account Type</label>
          <div class="flex p-1.5 bg-black/40 border border-white/10 rounded-xl relative shadow-inner gap-1">
            <label class="flex-1 cursor-pointer relative z-10">
              <input type="radio" name="role" value="user" class="peer hidden" checked>
              <div class="text-center py-3 text-xs uppercase tracking-widest font-bold text-gray-500 peer-checked:bg-purple-500/20 peer-checked:text-purple-300 rounded-lg transition-all duration-300 border border-transparent peer-checked:border-purple-500/30">User</div>
            </label>
            <label class="flex-1 cursor-pointer relative z-10">
              <input type="radio" name="role" value="admin" class="peer hidden">
              <div class="text-center py-3 text-xs uppercase tracking-widest font-bold text-gray-500 peer-checked:bg-fuchsia-500/20 peer-checked:text-fuchsia-300 rounded-lg transition-all duration-300 border border-transparent peer-checked:border-fuchsia-500/30">Admin</div>
            </label>
          </div>
        </div>

        <div class="space-y-2">
          <label for="email" class="text-xs uppercase tracking-widest font-semibold text-gray-400">Email address</label>
          <div class="relative">
            <i data-feather="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input required
              id="email"
              type="email" 
              class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-5 py-4 text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500 transition-all shadow-inner"
              placeholder="john@company.com"
            >
          </div>
        </div>
        
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label for="password" class="text-xs uppercase tracking-widest font-semibold text-gray-400">Password</label>
            <a href="404.html" class="text-[11px] uppercase tracking-wider font-semibold text-purple-400 hover:text-purple-300 transition-colors">Forgot Password?</a>
          </div>
          <div class="relative">
            <i data-feather="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input required
              id="password"
              type="password" 
              class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-12 py-4 text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500 transition-all shadow-inner"
              placeholder="••••••••"
            >
            <button type="button" onclick="const p = document.getElementById('password'); const i = this.querySelector('i'); if(p.type === 'password') { p.type = 'text'; i.setAttribute('data-feather', 'eye-off'); } else { p.type = 'password'; i.setAttribute('data-feather', 'eye'); } feather.replace();" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors focus:outline-none">
              <i data-feather="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        
        <div class="flex items-center space-x-3 pt-2 pb-2">
          <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-600 bg-black/50 accent-purple-500 cursor-pointer">
          <label for="remember" class="text-sm text-gray-400 cursor-pointer select-none">Remember me for 30 days</label>
        </div>

        <button id="login-btn" type="submit" class="w-full py-4 text-sm uppercase tracking-widest font-bold bg-white text-black rounded-xl hover:bg-gray-200 transition-all shadow-lg transform hover:-translate-y-1 active:translate-y-0 text-center flex justify-center items-center gap-2">
          Sign In
          <i data-feather="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
      
      <div class="mt-8 text-center text-sm text-gray-500 flex flex-col gap-5 items-center">
        <div>
          Don't have an account? 
          <a href="signup.html" class="text-purple-400 font-bold hover:text-purple-300 transition-colors ml-1 dropdown-link">Create an account</a>
        </div>
        <div class="w-full border-t border-white/10 pt-5">
          <a href="index.html" class="flex justify-center items-center gap-2 text-[11px] uppercase tracking-widest font-bold text-gray-400 hover:text-white transition-colors group">
            <i data-feather="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
            <span>Back to Home</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    feather.replace();
  </script>
  <!-- Lenis Smooth Scrolling -->
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.35/dist/lenis.min.js"></script>
  <script>
    const lenis = new Lenis()
    function raf(time) {
      lenis.raf(time)
      requestAnimationFrame(raf)
    }
    requestAnimationFrame(raf)
  </script>
</body>
</html>
