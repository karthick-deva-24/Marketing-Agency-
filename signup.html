<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Stackly Marketing Agency</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#000000',
            foreground: '#ffffff',
            primary: '#a855f7',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
    
    .glass-form { 
      background: rgba(15, 23, 42, 0.4); 
      backdrop-filter: blur(25px); 
      border: 1px solid rgba(255,255,255,0.08); 
    }
    
    .deep-purple-glow {
      position: absolute;
      width: 150vw;
      height: 70vh;
      left: 50%;
      transform: translateX(-50%);
      top: -10vh;
      background: radial-gradient(ellipse at center, rgba(124, 58, 237, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* Ambient background orbs */
    .bg-shape {
      position: absolute;
      filter: blur(120px);
      border-radius: 50%;
      z-index: -2;
      animation: pulse 10s infinite alternate ease-in-out;
    }
    
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      100% { transform: scale(1.2) translate(30px, -50px); opacity: 0.6; }
    }
  </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative selection:bg-purple-500/30 overflow-y-auto py-12">

  <!-- Floating Navigation Home Button -->
  <a href="index.html" class="absolute top-8 left-8 text-white/50 hover:text-white transition-colors flex items-center gap-2 group z-50">
    <i data-feather="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
    <span class="text-xs uppercase tracking-widest font-semibold">Back to Home</span>
  </a>

  <!-- Animated Background Orbs -->
  <div class="deep-purple-glow fixed"></div>
  <div class="bg-shape bg-purple-600/40 w-[60vw] h-[60vw] md:w-[40vw] md:h-[40vw] top-[-10%] left-[-10%] fixed"></div>
  <div class="bg-shape bg-fuchsia-500/30 w-[50vw] h-[50vw] md:w-[35vw] md:h-[35vw] bottom-[-10%] right-[-10%] fixed" style="animation-delay: -5s"></div>

  <main class="w-full max-w-lg p-8 relative z-10 mx-6 my-10 space-y-10">
    <div class="text-center">
      <span class="inline-block border border-purple-500/30 rounded-full px-4 py-1.5 text-xs tracking-widest font-bold text-purple-400 mb-6 bg-purple-500/10 backdrop-blur-sm uppercase">Join Stackly</span>
      <h1 class="text-4xl font-medium tracking-tight text-white mb-3">Create an Account</h1>
      <p class="text-gray-400 font-light text-sm">Register to scale your marketing, manage campaigns, and drive growth.</p>
    </div>

    <div class="glass-form p-8 md:p-10 rounded-3xl shadow-[0_0_50px_rgba(168,85,247,0.15)]">
      <form class="space-y-6" onsubmit="event.preventDefault(); if(this.checkValidity()) window.location.href='login.html';">
        
        <!-- Role Selection -->
        <div class="space-y-2">
          <label class="text-xs uppercase tracking-widest font-semibold text-gray-400">Account Type</label>
          <div class="flex p-1.5 bg-black/40 border border-white/10 rounded-xl relative shadow-inner gap-1">
            <label class="flex-1 cursor-pointer relative z-10">
              <input type="radio" name="role" value="user" class="peer hidden" checked>
              <div class="text-center py-3 text-xs uppercase tracking-widest font-bold text-gray-500 peer-checked:bg-purple-500/20 peer-checked:text-purple-300 rounded-lg transition-all duration-300 border border-transparent peer-checked:border-purple-500/30">User</div>
            </label>
            <label class="flex-1 cursor-pointer relative z-10">
              <input type="radio" name="role" value="admin" class="peer hidden">
              <div class="text-center py-3 text-xs uppercase tracking-widest font-bold text-gray-500 peer-checked:bg-fuchsia-500/20 peer-checked:text-fuchsia-300 rounded-lg transition-all duration-300 border border-transparent peer-checked:border-fuchsia-500/30">Admin</div>
            </label>
          </div>
        </div>

        <!-- Full Name -->
        <div class="space-y-2">
          <label for="fullname" class="text-xs uppercase tracking-widest font-semibold text-gray-400">Full Name</label>
          <div class="relative">
            <i data-feather="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input required
              id="fullname"
              type="text" 
              class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-5 py-4 text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500 transition-all shadow-inner"
              placeholder="John Doe"
            >
          </div>
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label for="email" class="text-xs uppercase tracking-widest font-semibold text-gray-400">Email address</label>
          <div class="relative">
            <i data-feather="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input required
              id="email"
              type="email" 
              class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-5 py-4 text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500 transition-all shadow-inner"
              placeholder="john@company.com"
            >
          </div>
        </div>
        
        <!-- Password -->
        <div class="space-y-2">
          <label for="password" class="text-xs uppercase tracking-widest font-semibold text-gray-400">Password</label>
          <div class="relative">
            <i data-feather="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input required
              id="password"
              type="password" 
              class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-5 py-4 text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500 transition-all shadow-inner"
              placeholder="••••••••"
            >
          </div>
        </div>
        
        <!-- Confirm Password -->
        <div class="space-y-2">
          <label for="confirm-password" class="text-xs uppercase tracking-widest font-semibold text-gray-400">Confirm Password</label>
          <div class="relative">
            <i data-feather="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input required
              id="confirm-password"
              type="password" 
              class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-5 py-4 text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500 transition-all shadow-inner"
              placeholder="••••••••"
            >
          </div>
        </div>
        
        <div class="flex items-start space-x-3 pt-2 pb-2">
          <input type="checkbox" id="terms" class="w-4 h-4 mt-0.5 rounded border-gray-600 bg-black/50 accent-purple-500 cursor-pointer">
          <label for="terms" class="text-sm text-gray-400 cursor-pointer select-none leading-tight">
            I agree to the <a href="404.html" class="text-purple-400 hover:text-purple-300 underline underline-offset-2">Terms of Service</a> and <a href="404.html" class="text-purple-400 hover:text-purple-300 underline underline-offset-2">Privacy Policy</a>
          </label>
        </div>

        <button id="signup-btn" type="submit" class="w-full py-4 text-sm uppercase tracking-widest font-bold bg-white text-black rounded-xl hover:bg-gray-200 transition-all shadow-lg transform hover:-translate-y-1 active:translate-y-0 text-center flex justify-center items-center gap-2">
          Create Account
          <i data-feather="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
      
      <div class="mt-8 text-center text-sm text-gray-500">
        Already have an account? 
        <a href="login.html" class="text-purple-400 font-bold hover:text-purple-300 transition-colors ml-1 dropdown-link">Sign In</a>
      </div>
    </div>
  </main>

  <script>
    feather.replace();
  </script>
  <!-- Lenis Smooth Scrolling -->
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.35/dist/lenis.min.js"></script>
  <script>
    const lenis = new Lenis()
    function raf(time) {
      lenis.raf(time)
      requestAnimationFrame(raf)
    }
    requestAnimationFrame(raf)
  </script>
</body>
</html>
